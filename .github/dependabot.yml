version: 2
updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "⬆️ github-actions"

  # "npm" is the ecosystem name for the whole JavaScript family, pnpm included; there is no
  # separate "pnpm" value. The renderer installs from its own lockfile, so it needs its own
  # entry or its dependencies never get updated.
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/src/ui"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "⬆️ pnpm"


  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "⬆️ nuget"