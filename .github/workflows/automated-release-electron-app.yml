name: Automated Electron App Release
run-name: "YakShaver App Release - Build #${{ github.run_number }} - ${{ github.event.head_commit.message }}"

on:
  push:
    branches:
      - main

# One release build at a time. Merges land in bursts, dependabot's especially, and two release
# runs started seconds apart otherwise race each other overwriting the same release assets.
# Never cancel a run already in flight: it may be part-way through publishing a release.
concurrency:
  group: automated-electron-release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  NODE_VERSION: 24

jobs:
  auto-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tag_name: ${{ steps.get_version.outputs.tag_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # The triggering commit, so SHORT_SHA below describes the commit being released
          # rather than whatever reached main by the time this step ran.
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: false
          install: false

      - name: Generate version
        id: get_version
        run: |
          # Generate version: YYYY.M.D-BUILD.RUN_NUMBER.SHORT_SHA
          YEAR=$(date +'%Y')
          MONTH=$(date +'%-m')   # Remove leading zero
          DAY=$(date +'%-d')     # Remove leading zero
          RUN_NUMBER=${{ github.run_number }}
          SHORT_SHA=$(git rev-parse --short HEAD)

          VERSION="${YEAR}.${MONTH}.${DAY}-BUILD.${RUN_NUMBER}.${SHORT_SHA}"

          echo "Generated version: $VERSION"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag_name=${VERSION}" >> $GITHUB_OUTPUT

      - name: Create and publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ steps.get_version.outputs.tag_name }}"
          VERSION="${{ steps.get_version.outputs.version }}"

          # --target takes a commitish. Pinning it to the triggering commit keeps the tag on
          # the same commit the build jobs package and the one SHORT_SHA in the version names.
          gh release create "$TAG_NAME" \
            --title "$VERSION" \
            --generate-notes \
            --target "${{ github.sha }}" \
            --draft=false

          echo "Release created and published"

      - name: Extract PR number from commit
        id: pr_number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Extract PR number from squash merge format: "title (#123)".
          # A title may contain multiple "(#N)" refs (e.g. "... (rebase #917) (#936)");
          # the squash PR number is the LAST one, so take tail -1.
          PR_NUMBER=$(git log -1 --pretty=%B | head -1 | grep -oE '\(#[0-9]+\)' | tail -1 | grep -oE '[0-9]+' || echo "")

          # Fallback: use GitHub API to find PR by commit SHA
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER=$(gh pr list --search "${{ github.sha }}" --state merged --json number --jq '.[0].number' 2>/dev/null || echo "")
          fi

          # Guard: keep only a single, purely-numeric value so a malformed
          # result can never write an invalid line to GITHUB_OUTPUT.
          PR_NUMBER=$(printf '%s' "$PR_NUMBER" | grep -oE '^[0-9]+$' | head -1 || echo "")

          echo "pr_number=${PR_NUMBER}" >> $GITHUB_OUTPUT
          echo "Found PR number: ${PR_NUMBER}"

      - name: Comment on PR
        if: steps.pr_number.outputs.pr_number != ''
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ steps.pr_number.outputs.pr_number }}
          body: |
            ✅ **Automated Release Created Successfully**

            **Release Details:**
            - **Version:** ${{ steps.get_version.outputs.version }}
            - **Tag:** ${{ steps.get_version.outputs.tag_name }}
            - **Release:** https://github.com/${{ github.repository }}/releases/tag/${{ steps.get_version.outputs.tag_name }}

            You can monitor the build progress in the [Actions tab](https://github.com/${{ github.repository }}/actions/workflows/automated-release-electron-app.yml).

  # Trigger the release build workflow directly (bypasses GITHUB_TOKEN limitation)
  trigger-build:
    needs: auto-release
    uses: ./.github/workflows/release-electron-app.yml
    with:
      tag_name: ${{ needs.auto-release.outputs.tag_name }}
      # The triggering commit, not the branch. `main` is a moving pointer, so a build taking
      # ten minutes can check out whatever landed meanwhile and ship a commit nobody released.
      # Build #307 hit exactly that: its workflow file was the npm version, but by the time the
      # manifest job checked out `main` the pnpm migration had merged and package-lock.json was
      # gone, so actions/setup-node failed with "Some specified paths were not resolved".
      target: ${{ github.sha }}
    secrets: inherit
